<!-- this tells the browser that this is an HTML 5 webpage -->
<!DOCTYPE html>
<!-- this is the way the page needs to be setup; lang=English - leave this -->
<html lang="en">
<!-- this is the head section - this is primarily for the browser and search engines -->
<head>
    <!-- heads up to the browser that pretty much any language might be on our page -->
    <meta charset="UTF-8">
    <!-- this is the first step in mobile development - the wepage will look funky on a phone without this -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- the text for the browser tab -->
    <title>JavaScript Function Demo</title>
    <!-- add a link to the JavaScript file -->
    <script src="code.js"></script>
    <!-- add a link to the CSS file -->
    <link rel="stylesheet" href="main.css">
</head>
<!-- anything we want our user to see should go in the body section -->
<body>
    <!-- this is typically info at the top of the page -->
    <header>
        <!-- this is the page title - only use 1 h1 tag a page -->
        <h1 id="heading">Welcome to my page</h1>
        <!-- this is a button that will call the updateText function when clicked -->
        <button onclick="updateText();">Change Text</button>
    </header>

    <!-- this is where the main content of the page goes -->
    <main>
        <!-- this button calls the playCraps function when clicked -->
        <button onClick="playCraps()">Play Craps</button>
        <!-- this is where the dice rolls and results will be displayed -->
        <div id="divRoll1">Roll 1</div>
        <div id="divRoll2">Roll 2</div>
        <div id="divSum">Sum</div>
        <div id="divResult">Result</div>
    </main>
<!-- the closing body tag should be the 2nd last line of code on each HTML page -->
</body>
<!-- this is always the last line of our HTML page -->
</html>
